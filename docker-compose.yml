# Dev MySQL for the portfolio backend, isolated in Docker.
#
#   Start:  docker compose -f backend/docker-compose.yml up -d
#   Stop:   docker compose -f backend/docker-compose.yml down
#
# Port 3308 on purpose — 3306 is your native MySQL (Workbench one) and
# 3307 belongs to another project's container, so nothing collides.
#
# DEV-ONLY password. Fine here because the DB only listens on your machine.
# For a real hosted database (Render/Railway/PlanetScale) use a strong
# password and never put it in this file — use the host's env vars.
#
# Workbench can connect to this too: host 127.0.0.1, port 3308,
# user root, password portfolio_root_pw.
services:
  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: portfolio_root_pw
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3308:3306"
    volumes:
      - portfolio-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pprofile_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  portfolio-mysql-data:
