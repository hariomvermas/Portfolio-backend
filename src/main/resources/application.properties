# ── Application ────────────────────────────────────────────────
spring.application.name=portfolio-backend
server.port=8080

# ── MySQL ──────────────────────────────────────────────────────
# Credentials NEVER live in this file — they come from environment
# variables, so nothing secret is ever committed to GitHub.
#
# DB_PASSWORD has NO default on purpose: the app must fail fast rather
# than start against a guessed password. Set it one of these ways:
#
#   IntelliJ:  Run → Edit Configurations → Environment variables
#              DB_PASSWORD=yourpassword
#   PowerShell (this window only):
#              $env:DB_PASSWORD = "yourpassword"
#   PowerShell (permanent, new windows):
#              setx DB_PASSWORD "yourpassword"
#
# DB_HOST defaults to localhost (native MySQL). Using the Docker dev DB?
#   $env:DB_PORT = "3308"   (backend/docker-compose.yml maps 3308→3306)
# Deployed later? The host panel gives you DB_HOST / DB_PORT / DB_NAME /
# DB_USERNAME / DB_PASSWORD — set all five, plus DB_SSL=true if the host
# mandates TLS (Aiven does). No code change needed either way.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────────
# ddl-auto=update lets Hibernate create/patch the contact_messages
# table from the @Entity annotations — no SQL script to maintain.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Entities are short-lived in this app; the open-session-in-view pattern
# would only hide lazy-loading bugs. Off is the honest default.
spring.jpa.open-in-view=false

# ── CORS ───────────────────────────────────────────────────────
# Origins allowed to call the API. The env var APP_CORS_ALLOWED_ORIGINS
# overrides this line when you deploy (hosting panels set env vars easily).
# Keep the https Vercel URL — browsers send https Origin for live sites.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://portfolio-two-iota-q72i5n608f.vercel.app}

# ── Logging ────────────────────────────────────────────────────
# Bump to DEBUG when you want to see the exact SQL Hibernate runs.
logging.level.org.hibernate.SQL=INFO
