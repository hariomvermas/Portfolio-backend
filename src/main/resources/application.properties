spring.application.name=portfolio-backend

server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/hariom_portfolio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true